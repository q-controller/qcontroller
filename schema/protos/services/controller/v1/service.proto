syntax = "proto3";

package services.controller.v1;

import "services/controller/v1/messages.proto";
import "services/process/v1/messages.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/q-controller/qcontroller/src/generated/services/controller/v1;v1";

service ControllerService {
    rpc Create(CreateRequest) returns (google.protobuf.Empty) {}
    rpc Start(StartRequest) returns (google.protobuf.Empty) {}
    rpc Stop(StopRequest) returns (google.protobuf.Empty) {}
    rpc Remove(RemoveRequest) returns (google.protobuf.Empty) {}
    rpc Info(InfoRequest) returns (InfoResponse) {}
    rpc Logs(services.process.v1.LogsRequest) returns (stream services.process.v1.LogsResponse) {}
    rpc SnapshotSave(services.process.v1.SnapshotSaveRequest) returns (google.protobuf.Empty) {}
    rpc SnapshotLoad(services.process.v1.SnapshotLoadRequest) returns (google.protobuf.Empty) {}
    rpc SnapshotDelete(services.process.v1.SnapshotDeleteRequest) returns (google.protobuf.Empty) {}
    rpc SnapshotList(services.process.v1.SnapshotListRequest) returns (services.process.v1.SnapshotListResponse) {}
}
